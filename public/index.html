<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Conjunto-IA | Administración de conjuntos residenciales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --azul:#0B4F8A;--azul2:#1867B0;--verde:#14A38B;--verdeOsc:#0E8571;--wa:#1F8A4C;
  --fondo:#F4F8FB;--sup:#FFFFFF;--texto:#1C2B39;--suave:#5D6B78;--borde:#DCE5EE;
  --azulSuave:#E8F1FA;--verdeSuave:#E3F6F2;--ambarSuave:#FDF3DC;--ambar:#8A5A00;--rojoSuave:#FBE5E2;--rojo:#A3322A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.55 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:#fff}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;line-height:1.1;margin:0 0 .35em;color:var(--azul);font-weight:700}
h1{font-size:34px}h2{font-size:25px}h3{font-size:20px}
p{margin:0 0 .8em}
a{color:var(--azul2)}
.suave{color:var(--suave)}
.peq{font-size:14px}
button{font-family:inherit}
:focus-visible{outline:3px solid rgba(20,163,139,.5);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#fff;box-shadow:0 2px 12px rgba(11,79,138,.10);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
.brand .n{font-family:'Barlow Condensed',Arial,sans-serif;font-weight:700;font-size:23px;color:var(--azul);line-height:1}
.brand .s{font-size:12.5px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.top-der{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip-u{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;text-align:right}
.chip-u b{font-size:14.5px}
.chip-u span{font-size:12.5px;color:var(--verdeOsc);font-weight:600}
.topbar>.chip-u{margin-left:auto}
.topbar>.chip-u~.top-der{margin-left:12px}
.cj-m,.corta{display:none}
.ic-btn{position:relative;border:1.5px solid var(--borde);background:#fff;border-radius:12px;min-width:44px;height:44px;display:grid;place-items:center;font-size:19px;cursor:pointer;padding:0 8px}
.ic-btn .num{position:absolute;top:-6px;right:-6px;background:#C0392B;color:#fff;border-radius:999px;font-size:11.5px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.hamb{display:none}
.franja-super{background:#1E3A4C;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600}
.franja-super .btn{min-height:38px}

/* Estructura */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 62px)}
aside.menu{background:#fff;border-right:1px solid var(--borde);padding:12px 10px 30px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.menu .grp{font-size:13px;font-weight:700;color:var(--suave);margin:16px 12px 6px}
.menu a{display:flex;gap:11px;align-items:center;padding:8px 10px;border-radius:12px;color:var(--texto);text-decoration:none;font-weight:500;margin-bottom:2px;cursor:pointer}
.menu a:hover{background:var(--fondo)}
.menu a .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.g0 .ic{background:var(--azulSuave)}.g1 .ic{background:#E6EEF8}.g2 .ic{background:var(--verdeSuave)}.g3 .ic{background:var(--ambarSuave)}.g4 .ic{background:#EEF1F5}.g5 .ic{background:#F0ECF8}
.menu a.on{background:var(--verdeSuave);color:var(--verdeOsc);font-weight:700}
.menu a.on .ic{background:var(--verde);color:#fff}
.velo{display:none}
main{padding:22px 22px 140px;max-width:1120px;width:100%}
.volver{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--borde);color:var(--azul);font-weight:700;font-size:15.5px;border-radius:10px;padding:9px 14px;cursor:pointer;margin-bottom:14px}
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.cab .acc{display:flex;gap:8px;flex-wrap:wrap}
.origen{background:var(--azulSuave);border-left:4px solid var(--azul);padding:10px 14px;border-radius:8px;font-size:14.5px;color:#22476b;margin:4px 0 18px}

/* Botones */
.btn{appearance:none;border:0;border-radius:11px;padding:11px 18px;font:600 16px 'Public Sans',Arial,sans-serif;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2;text-align:center}
.btn-p{background:var(--verde);color:#fff}.btn-p:hover{background:var(--verdeOsc)}
.btn-a{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff}
.btn-s{background:#fff;color:var(--azul);border:1.5px solid var(--borde)}.btn-s:hover{border-color:var(--azul2)}
.btn-wa{background:var(--wa);color:#fff}
.btn-r{background:#fff;color:var(--rojo);border:1.5px solid #E7B9B3}
.btn-sm{min-height:40px;padding:8px 13px;font-size:14.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--azul2);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px;text-decoration:underline}

/* Formularios */
.campo{margin-bottom:14px}
.campo label{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
.campo .ayuda{font-size:13px;color:var(--suave);margin-top:4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],input:not([type]),select,textarea{width:100%;background:#fff;color:var(--texto);border:1.5px solid var(--borde);border-radius:10px;padding:11px 12px;font:16px 'Public Sans',Arial,sans-serif;color-scheme:light;min-height:46px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(20,163,139,.3);border-color:var(--verde)}
input[type=checkbox],input[type=radio]{appearance:none;-webkit-appearance:none;width:24px;height:24px;background:#fff;border:2px solid #9FB3C6;border-radius:7px;display:inline-grid;place-items:center;cursor:pointer;margin:0;flex:none;vertical-align:middle}
input[type=radio]{border-radius:50%}
input[type=checkbox]:checked,input[type=radio]:checked{background:var(--verde);border-color:var(--verde)}
input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
input[type=radio]:checked::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;cursor:pointer}
.clave{position:relative}
.clave input{padding-right:110px}
.clave .ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--azulSuave);border:0;border-radius:8px;color:var(--azul);font-weight:700;font-size:13.5px;padding:7px 10px;cursor:pointer}
.sec{border-radius:14px;padding:16px 16px 4px;margin-bottom:14px;background:#fff;border:1px solid var(--borde);border-top:5px solid var(--azul)}
.sec.v{border-top-color:var(--verde)}.sec.a{border-top-color:#E0A21A}
.sec>h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fila>input{flex:1;min-width:150px}

/* Contenido */
.panel{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:18px;margin-bottom:16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--borde);border-radius:12px;background:#fff;margin-bottom:9px;flex-wrap:wrap}
.item .izq{flex:1;min-width:200px}
.item .der{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item.anulado{opacity:.6;background:#FAFBFC}
.item.anulado .izq b{text-decoration:line-through}
.vacio{border:2px dashed var(--borde);border-radius:14px;padding:22px;text-align:center;color:var(--suave);margin-bottom:12px;background:#fff}
.b{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;vertical-align:middle}
.b-ok{background:var(--verdeSuave);color:var(--verdeOsc)}.b-warn{background:var(--ambarSuave);color:var(--ambar)}.b-bad{background:var(--rojoSuave);color:var(--rojo)}.b-info{background:var(--azulSuave);color:var(--azul)}.b-gris{background:#EEF1F5;color:var(--suave)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:15px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;border-left:5px solid var(--azul)}
.kpi:hover{border-color:var(--azul2)}
.kpi .v{font:700 38px/1 'Barlow Condensed',Arial,sans-serif;color:var(--azul);display:block;margin-bottom:4px}
.kpi .l{color:var(--suave);font-size:14px}
.kpi.verde{border-left-color:var(--verde)}.kpi.verde .v{color:var(--verdeOsc)}
.kpi.alerta{border-left-color:#C0392B}.kpi.alerta .v{color:var(--rojo)}
.acciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.acc-btn{background:#fff;border:1.5px solid var(--borde);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:600 15.5px 'Public Sans',Arial,sans-serif;color:var(--texto);display:flex;flex-direction:column;gap:6px}
.acc-btn .e{font-size:24px}
.acc-btn:hover{border-color:var(--verde);background:var(--verdeSuave)}
.tabla{overflow-x:auto;border:1px solid var(--borde);border-radius:12px;background:#fff;margin-bottom:14px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:13.5px;color:var(--suave);background:var(--fondo);padding:10px 12px;font-weight:700}
td{padding:10px 12px;border-top:1px solid var(--borde);font-size:15px;vertical-align:middle}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.saludo{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:18px}
.saludo h1{color:#fff;margin-bottom:4px}
.saludo p{margin:0;opacity:.92}

/* Pase de visita (elemento distintivo) */
.pase{--hueco:var(--fondo);position:relative;background:linear-gradient(140deg,#0B4F8A 0%,#1867B0 70%,#14A38B 140%);color:#fff;border-radius:20px;padding:22px 24px;max-width:380px;box-shadow:0 14px 30px rgba(11,79,138,.22)}
.pase::before,.pase::after{content:"";position:absolute;top:58%;width:28px;height:28px;border-radius:50%;background:var(--hueco)}
.pase::before{left:-14px}.pase::after{right:-14px}
.pase .t{font-size:13.5px;opacity:.85;font-weight:600}
.pase .q{font:700 26px/1.1 'Barlow Condensed',Arial,sans-serif;margin:4px 0 2px}
.pase .u{font-size:15px;opacity:.95}
.pase .corte{border-top:2px dashed rgba(255,255,255,.45);margin:16px -24px 14px}
.pase .cod{font:700 60px/1 'Barlow Condensed',Arial,sans-serif;letter-spacing:.14em}
.pase .f{font-size:14px;opacity:.9;margin-top:6px}
.md .pase{--hueco:#fff;margin:4px auto 14px}

/* Parqueaderos */
.cupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.cupo{border-radius:14px;padding:14px;border:2px solid var(--borde);background:#fff}
.cupo.oc{border-color:#E0A21A;background:#FFFBF2}
.cupo .nm{font:700 26px/1 'Barlow Condensed',Arial,sans-serif;color:var(--azul)}

/* Firma */
.firma-box{border:2px dashed #9FB3C6;border-radius:12px;background:#fff;position:relative}
#firma{width:100%;height:150px;display:block;touch-action:none;cursor:crosshair}
.firma-img{max-width:150px;height:52px;object-fit:contain;background:#fff;border:1px solid var(--borde);border-radius:6px}

/* Market */
.mk{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mod{background:#fff;border:1.5px solid var(--borde);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mod.en{border-color:var(--verde);background:#FAFEFD}
.mod .pr{font:700 24px/1 'Barlow Condensed',Arial,sans-serif;color:var(--azul)}
.pedido{position:sticky;top:80px;background:#fff;border:2px solid var(--verde);border-radius:16px;padding:16px}
.pedido .tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;border-top:1px solid var(--borde);padding-top:10px;margin-top:6px}
.lin{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14.5px;align-items:center}

/* Barra de la demostración */
.demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#1E3A4C;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.demo-bar p{margin:0;font-weight:600}
.demo-bar .btn{min-height:42px;padding:9px 14px;font-size:15px}

.barra{height:10px;background:var(--azulSuave);border-radius:999px;overflow:hidden;margin-top:8px}.barra span{display:block;height:100%;background:var(--verde);border-radius:999px}
.foto{width:150px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--borde)}
.mini{width:38px;height:38px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px;border:1px solid var(--borde)}
.franja-pago{background:#FBE5E2;color:#7A1F17;padding:10px 16px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#offline{display:none;position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:150;background:#8A5A00;color:#fff;text-align:center;font-weight:700;padding:8px 12px;font-size:14px}
input[type=time],input[type=month]{width:100%;background:#fff;color:var(--texto);border:1.5px solid var(--borde);border-radius:10px;padding:11px 12px;font:16px 'Public Sans',Arial,sans-serif;color-scheme:light;min-height:46px}
input[type=file]{font:15px 'Public Sans',Arial,sans-serif;max-width:100%}
/* Avisos y ventanas */
#toasts{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;width:min(92vw,540px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--azul);color:#fff;font:700 16px/1.4 'Public Sans',Arial,sans-serif;padding:16px 18px;border-radius:14px;box-shadow:0 10px 28px rgba(11,79,138,.35);transition:opacity .4s,transform .4s}
.toast.fuera{opacity:0;transform:translateY(10px)}
.toast-in{background:var(--azul);color:#fff;font-weight:700;font-size:16px;padding:13px 15px;border-radius:12px;margin-bottom:12px}
.ov{position:fixed;inset:0;background:rgba(28,43,57,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.md{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md-h{padding:18px 20px 4px}
.md-b{padding:6px 20px 8px}
.md-f{padding:12px 20px 18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--borde);position:sticky;bottom:0;background:#fff}
.nota{background:var(--ambarSuave);border-radius:10px;padding:10px 12px;font-size:14px;color:#6B4700;margin-bottom:12px}
.ok-box{background:var(--verdeSuave);border-radius:12px;padding:14px 16px;color:#0B5E50;margin-bottom:12px}
.err{background:var(--rojoSuave);color:var(--rojo);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14.5px;margin-bottom:12px}

/* Portada */
.land-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#fff;box-shadow:0 2px 12px rgba(11,79,138,.10);display:flex;align-items:center;gap:10px;padding:10px 18px}
.hero{max-width:1120px;margin:0 auto;padding:44px 20px 30px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px;align-items:center}
.hero h1{font-size:clamp(36px,5.4vw,58px);line-height:1.02;color:var(--texto)}
.hero .lead{font-size:18.5px;color:#34495C;max-width:60ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero-pase{display:flex;justify-content:center} .hero-foto{position:relative;border-radius:22px;overflow:hidden;min-height:440px;background:#E8F1FA;box-shadow:0 10px 30px rgba(11,79,138,.15)} .hero-foto>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .hero-foto .hero-pase{position:relative;min-height:440px;align-items:flex-end;justify-content:flex-end;padding:18px} @media(max-width:820px){.hero-foto,.hero-foto .hero-pase{min-height:360px}}
.bloque{max-width:1120px;margin:0 auto;padding:26px 20px}
.perfiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.perfil{background:#fff;border:1.5px solid var(--borde);border-radius:16px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;gap:12px;align-items:flex-start}
.perfil:hover{border-color:var(--verde);background:#FAFEFD}
.perfil .e{font-size:28px;width:48px;height:48px;border-radius:14px;background:var(--azulSuave);display:grid;place-items:center;flex:none}
.perfil b{display:block;font-size:17px;color:var(--azul)}
.dolor{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.dolor>div{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--borde);overflow:hidden} .dolor img.dfoto{display:block;width:calc(100% + 32px);max-width:none;margin:-16px -16px 12px;height:170px;object-fit:cover;background:var(--suaveA,#E8F1FA)}
.dolor .antes{color:var(--rojo);font-weight:700;font-size:14px}
.dolor .ahora{color:var(--verdeOsc);font-weight:700;font-size:14px;margin-top:8px}
.planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{background:#fff;border:1.5px solid var(--borde);border-radius:16px;padding:18px}
.plan .pr{font:700 34px/1 'Barlow Condensed',Arial,sans-serif;color:var(--azul)}
.pie{background:#1E3A4C;color:#D6E2EC;padding:26px 20px calc(30px + env(safe-area-inset-bottom,0px));margin-top:30px}
.pie .in{max-width:1120px;margin:0 auto;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.pie a{color:#fff}
.acceso-sky{background:transparent;border:1px solid rgba(255,255,255,.35);color:#D6E2EC;border-radius:8px;font-size:13px;padding:7px 11px;cursor:pointer}
.caja{max-width:560px;margin:30px auto;padding:0 16px}

@media (max-width:900px){
  .hamb{display:grid}
  .shell{grid-template-columns:1fr}
  aside.menu{position:fixed;left:0;top:0;bottom:0;width:86%;max-width:320px;height:100%;transform:translateX(-105%);transition:transform .25s;z-index:60;padding-top:calc(env(safe-area-inset-top,0px) + 14px);box-shadow:4px 0 24px rgba(0,0,0,.18)}
  aside.menu.open{transform:none}
  .velo.open{display:block;position:fixed;inset:0;background:rgba(28,43,57,.45);z-index:55}
  main{padding:16px 14px 170px}
  .mk{grid-template-columns:1fr}
  .pedido{position:static}
  .hero{grid-template-columns:1fr;padding-top:26px;gap:26px}
  .dos,.grid2{grid-template-columns:1fr}

/* ---------- cobro de la suscripción ---------- */
function precioMes(c){return planDe(c.numUnidades).precio}
function estadoCJ(c){
  if(c.interna)return{k:'activa',t:'Activa (empresa interna)',cl:'b-ok'};
  const t=hoy();
  if((!c.pagadoHasta||c.pagadoHasta<c.pruebaHasta)&&t<=c.pruebaHasta){const n=diasEntre(t,c.pruebaHasta)+1;return{k:'prueba',t:'En prueba: '+n+(n===1?' día':' días'),cl:'b-warn',n}}
  if(c.pagadoHasta&&t<=c.pagadoHasta)return{k:'activa',t:'Activa',cl:'b-ok'};
  if(c.pagadoHasta&&c.pagadoHasta>=c.pruebaHasta){
    const d=new Date(c.pagadoHasta+'T12:00:00');const y=d.getFullYear(),m=d.getMonth()+1;
    const d5=iso(new Date(y,m,5)),d10=iso(new Date(y,m,10));
    if(t<d5)return{k:'activa',t:'Activa: pendiente el pago del mes',cl:'b-warn'};
    if(t<d10){const n=diasEntre(t,d10);return{k:'aviso',t:'Aviso: '+n+(n===1?' día':' días'),cl:'b-bad',n}}
  }
  return{k:'cerrada',t:'Cerrada por pago',cl:'b-bad'};
}
function alDiaHasta(c){
  const t=hoy();
  if(c.pagadoHasta&&c.pagadoHasta>=t&&c.pagadoHasta>=c.pruebaHasta)return finMes(addD(c.pagadoHasta,1));
  const ini=t<=c.pruebaHasta?addD(c.pruebaHasta,1):t;
  const d=new Date(ini+'T12:00:00');
  if(d.getDate()<=5)return finMes(ini);
  return iso(new Date(d.getFullYear(),d.getMonth()+2,0));
}

/* ---------- cartera ---------- */
function cuentaU(uId){
  const per=periodo();
  const cs=S.cuotas.filter(c=>c.unidad===uId).sort((a,b)=>a.periodo.localeCompare(b.periodo));
  const cargos=cs.filter(c=>c.valor>0),creditos=cs.filter(c=>c.valor<0);
  const ps=S.pagos.filter(p=>p.unidad===uId&&p.estado==='aprobado');
  const tot=sum(cs,'valor'),pag=sum(ps,'valor');
  let resto=pag-sum(creditos,'valor');
  const esInt=c=>c.concepto==='Intereses de mora'?0:1;
  const orden=cargos.slice().sort((a,b)=>esInt(a)-esInt(b)||a.periodo.localeCompare(b.periodo));
  let vencido=0;const meses=new Set(),pendientes=[];
  for(const c of orden){const cubre=Math.min(Math.max(resto,0),c.valor);resto-=cubre;const falta=c.valor-cubre;if(falta>0){pendientes.push({c,falta});if(c.periodo<per){vencido+=falta;meses.add(c.periodo)}}}
  pendientes.sort((a,b)=>a.c.periodo.localeCompare(b.c.periodo));
  return{tot,pag,saldo:tot-pag,vencido,mesesV:meses.size,enMora:vencido>0,cs,ps,pendientes};
}

/* ---------- firma manuscrita ---------- */
function initFirma(){
  const cv=document.getElementById('firma');if(!cv)return;
  const r=cv.getBoundingClientRect();cv.width=Math.max(300,Math.round(r.width*2));cv.height=300;
  const x=cv.getContext('2d');x.setTransform(cv.width/r.width,0,0,2,0,0);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1C2B39';
  let d=false;cv.dataset.vacia='1';
  const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{d=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}const[a,b]=p(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke();cv.dataset.vacia='0'};
  cv.onpointerup=cv.onpointercancel=()=>{d=false};
}

function cajaCodigo(){return`<div class="panel" style="border-top:5px solid var(--verde)"><h2>Ingreso con pase</h2><p class="suave">Pida al visitante el código de 6 números que le envió el residente.</p><div class="fila" style="margin-bottom:12px"><input id="codIn" inputmode="numeric" maxlength="6" placeholder="Ej. 482913" aria-label="Código del pase" style="font-size:22px;letter-spacing:.15em;font-weight:700"><button class="btn btn-p" data-act="buscarCodigo">Buscar pase</button></div><button class="btn btn-s" data-act="visitaSinPase">Registrar visita sin pase (confirmada por citófono)</button></div>`}

ACT.login=async()=>{const correo=val('lgCorreo').toLowerCase(),clave=val('lgClave');
  if(!correo||!clave)return errModal2('Escriba el correo y la contraseña.');
  const k=S.intentos[correo]||{n:0,hasta:0};if(k.hasta>Date.now())return errModal2('Por seguridad, esta cuenta quedó bloqueada 15 minutos después de 5 intentos fallidos. Intente más tarde o cree una contraseña nueva.');
  const h=await sha(clave);const us=S.usuarios.filter(x=>x.correo===correo&&!x.demo&&x.hash===h&&S.conjuntos.some(c=>c.id===x.cj));
  if(!us.length){k.n++;if(k.n>=5){k.hasta=Date.now()+15*6e4;k.n=0}S.intentos[correo]=k;guardar();return errModal2('El correo o la contraseña no coinciden.'+(k.hasta>Date.now()?' La cuenta quedó bloqueada 15 minutos.':''))}
  delete S.intentos[correo];
  const act=us.filter(u=>u.activo&&!u.bloqueado&&!u.pendiente);
  if(!act.length){const p=us.find(u=>u.pendiente);return errModal2(p?'Su inscripción todavía está esperando la aprobación de la administración del conjunto. Le avisamos apenas la aprueben.':'Esta cuenta está desactivada. Comuníquese con la administración del conjunto.')}
  if(act.length>1){guardar();return modal('¿A qué conjunto quiere entrar?',act.map(u=>{const c=S.conjuntos.find(x=>x.id===u.cj);return item(`<b>${esc(c.nombre)}</b><div class="suave peq">${PERFILES[u.perfil].n}, ${esc(c.ciudad)}</div>`,`<button class="btn btn-p btn-sm" data-act="entrarCJ" data-id="${u.id}">Entrar</button>`)}).join(''),'','Cancelar')}
  ACT.entrarCJ({id:act[0].id})};

  if(de('reservas').some(r=>r.zona===z.id&&r.fecha===f&&r.franja===fr&&['pendiente','aprobada'].includes(r.estado)))return modal('Ese horario está ocupado',`<p>${esc(z.nombre)} ya está reservada el ${fFecha(f)}, de ${FRANJAS[fr]}. Escoja otra franja u otro día.</p>`,'','Cerrar');
  const r={id:uid('r'),cj:SES.cj,zona:z.id,unidad:u.unidad,fecha:f,franja:fr,estado:z.aprob?'pendiente':'aprobada',solicita:u.nombre,creado:ahora()};S.reservas.push(r);
  if(z.aprob)aviso(SES.cj,{perfil:'admin'},'Reserva por aprobar: '+z.nombre+', '+f+', '+uLbl(u.unidad).replace(/<[^>]+>/g,''),'reservas');guardar();render();
  modal(z.aprob?'Reserva enviada':'Reserva confirmada',`<div class="ok-box"><b>${esc(z.nombre)}</b><br>${fFecha(f)}, ${FRANJAS[fr]}</div><p>${z.aprob?'La administración debe aprobarla. Le llega un aviso apenas la revise.':'Quedó lista. La ve en «Mis reservas».'}${z.deposito?' Depósito: '+money(z.deposito)+', que se paga a la administración.':''}</p>`,'','Listo')};

/* cartera */
function presupuestoVigente(c,per){if(c.desdeProx&&per>=c.desdeProx&&c.presupuestoProx){c.presupuesto=c.presupuestoProx;if(c.rubrosProx)c.rubros=c.rubrosProx;delete c.presupuestoProx;delete c.rubrosProx;delete c.desdeProx;log('Empezó a regir el presupuesto nuevo')}return c.presupuesto}
ACT.generarCuotas=()=>{const c=cj(),per=periodo();const pres=presupuestoVigente(c,per);
  if(!(pres>0))return modal('Falta el presupuesto','<p>Escriba primero el presupuesto mensual del conjunto en «Datos del conjunto». La cuota de cada unidad se calcula con ese valor y su coeficiente.</p>','<button class="btn btn-p" data-act="nav" data-v="datos">Ir a Datos del conjunto</button>','Cerrar');
  const us=de('unidades');if(!us.length)return toast('Cargue primero las unidades.');let n=0,int=0,rec=0;
  us.forEach(u=>{if(S.cuotas.some(q=>q.unidad===u.id&&q.periodo===per&&q.concepto==='Cuota de administración'))return;const k=cuentaU(u.id);
    S.cuotas.push({id:uid('c'),cj:SES.cj,unidad:u.id,periodo:per,concepto:'Cuota de administración',valor:Math.round(pres*u.coef/100/100)*100,fecha:hoy()});n++;
    if(c.interes>0&&k.vencido>0){S.cuotas.push({id:uid('c'),cj:SES.cj,unidad:u.id,periodo:per,concepto:'Intereses de mora',valor:Math.round(k.vencido*c.interes/100),fecha:hoy()});int++}
    if(c.recordarMora&&k.enMora){aviso(SES.cj,{unidad:u.id},'Recordatorio: su unidad tiene '+money(k.vencido)+' vencidos. Póngase al día para evitar intereses y el cobro prejurídico.','cuenta');rec++}});
  if(n&&c.fondoPct>0)S.fondo.push({id:uid('f'),cj:SES.cj,fecha:hoy(),concepto:'Aporte de '+nomPer(per),valor:Math.round(pres*c.fondoPct/100)});
  log('Generó cuotas de '+per);guardar();render();toast('Se generaron '+n+' cuotas de '+nomPer(per)+(int?', '+int+' cobros de intereses':'')+(rec?' y '+rec+' recordatorios de mora':'')+'.')};
ACT.otroCobro=()=>modal('Otros cobros',`<p class="suave">Cobros distintos a la cuota mensual. Quedan en el estado de cuenta de la unidad y le llega un aviso.</p>${ERR}<div class="sec">${campo('Tipo','<select id="ocT"><option>Cuota extraordinaria</option><option>Parqueadero</option><option>Alquiler de zona común</option><option>Multa</option><option>Otro cobro</option></select>')}${campo('A quién',`<select id="ocA"><option value="todas">Todas las unidades, según su coeficiente</option>${optsUnidades('',false)}</select>`)}<div class="grid2">${campo('Valor','<input type="number" id="ocV" min="0" step="100">','Si es para todas, escriba el valor total: se reparte según el coeficiente de cada unidad.')}${campo('Detalle','<input id="ocD" placeholder="Ej. Impermeabilización, cuota 1 de 3">')}</div></div>`,'<button class="btn btn-p" data-act="otroCobroOk">Cargar el cobro</button>');
ACT.otroCobroOk=()=>{const t=val('ocT'),a=val('ocA'),v=+val('ocV'),dd=val('ocD');if(!(v>0))return errModal('Escriba el valor.');const per=periodo();const conc=t+(dd?': '+dd:'');let n=0;
  if(a==='todas'){de('unidades').forEach(u=>{const x=Math.round(v*u.coef/100/100)*100;if(x>0){S.cuotas.push({id:uid('c'),cj:SES.cj,unidad:u.id,periodo:per,concepto:conc,valor:x,fecha:hoy()});aviso(SES.cj,{unidad:u.id},'Nuevo cobro en su cuenta: '+conc+', '+money(x)+'.','cuenta');n++}})}
  else{S.cuotas.push({id:uid('c'),cj:SES.cj,unidad:a,periodo:per,concepto:conc,valor:v,fecha:hoy()});aviso(SES.cj,{unidad:a},'Nuevo cobro en su cuenta: '+conc+', '+money(v)+'.','cuenta');n=1}
  log('Cargó '+conc+' a '+n+' unidades');guardar();cerrarModal();render();toast('Cobro cargado a '+n+(n===1?' unidad':' unidades')+'.')};
ACT.registrarPago=()=>modal('Registrar un pago',`<p class="suave">El pago queda «por aprobar»: otra persona lo aprueba revisando el extracto del banco.</p>${ERR}<div class="sec">${campo('Unidad',`<select id="rgpU">${optsUnidades('',true)}</select>`)}<div class="grid2">${campo('Valor','<input type="number" id="rgpV" min="0" step="100">')}${campo('Fecha del pago',`<input type="date" id="rgpF" value="${hoy()}" max="${hoy()}">`)}${campo('Medio',`<select id="rgpM">${MEDIOS.map(m=>`<option>${m}</option>`).join('')}</select>`)}${campo('Referencia o número de recibo','<input id="rgpR">')}</div></div>`,'<button class="btn btn-p" data-act="registrarPagoOk">Guardar por aprobar</button>');
ACT.registrarPagoOk=()=>{const u=val('rgpU'),v=+val('rgpV'),f=val('rgpF');if(!u||!(v>0)||!f)return errModal('Escoja la unidad y escriba el valor y la fecha.');
  S.pagos.push({id:uid('p'),cj:SES.cj,unidad:u,valor:v,fecha:f,medio:val('rgpM'),ref:val('rgpR'),estado:'por aprobar',regPor:quienSoy()+' ('+PERFILES[perActual()].n.toLowerCase()+')',regUser:SES.uid,nota:''});aviso(SES.cj,{perfil:'consejo'},'Se registró un pago de '+money(v)+' para '+txt(uLbl(u))+'. Está por aprobar.','porAprobar');log('Registró pago por aprobar de '+money(v));guardar();cerrarModal();render();
  modal('Pago registrado','<div class="ok-box">Quedó en «Pagos por aprobar».</div><p>El saldo de la unidad baja cuando otra persona lo apruebe (administración, contador o consejo). Si su conjunto aún no tiene esos usuarios, créelos en «Usuarios».</p>','<button class="btn btn-p" data-act="nav" data-v="porAprobar">Ver pagos por aprobar</button>','Cerrar')};
ACT.verCuenta=d=>{const k=cuentaU(d.id),u=unidad(d.id);modal('Estado de cuenta',`<p><b>${uLbl(d.id)}</b>, ${esc(u.prop)}<br>Saldo: <b>${money(Math.max(0,k.saldo))}</b>${k.enMora?`, vencido <b style="color:var(--rojo)">${money(k.vencido)}</b>`:''}</p>${movimientosHTML(d.id)}`,`<button class="btn btn-s" data-act="certDeuda" data-id="${d.id}">Certificado de deuda</button><button class="btn btn-a" data-act="cuentaPDF" data-id="${d.id}">Estado de cuenta (PDF)</button>`,'Cerrar')};
function aprobarPagoInt(p){p.estado='aprobado';p.aprobPor=quienSoy();p.aprobEn=hoy();const kk='rc-'+SES.cj;S.seq[kk]=(S.seq[kk]||0)+1;p.recibo='RC-'+String(S.seq[kk]).padStart(5,'0');
  const c=cj();let desc=0;
  if(c.pronto&&c.pronto.pct>0){const per=p.fecha.slice(0,7),dia=+p.fecha.slice(8,10);const q=S.cuotas.find(x=>x.unidad===p.unidad&&x.periodo===per&&x.concepto==='Cuota de administración');
    if(q&&dia<=c.pronto.dia&&!S.cuotas.some(x=>x.unidad===p.unidad&&x.periodo===per&&x.concepto==='Descuento por pronto pago')){const d=Math.round(q.valor*c.pronto.pct/100/100)*100;const k=cuentaU(p.unidad);if(d>0&&k.saldo>0&&k.saldo<=d&&!k.enMora){S.cuotas.push({id:uid('c'),cj:SES.cj,unidad:p.unidad,periodo:per,concepto:'Descuento por pronto pago',valor:-d,fecha:p.fecha});desc=d}}}
  aviso(SES.cj,{unidad:p.unidad},'Su pago de '+money(p.valor)+' fue aprobado (recibo '+p.recibo+')'+(desc?' y recibió '+money(desc)+' de descuento por pronto pago':'')+'.','cuenta');log('Aprobó pago de '+money(p.valor)+' de '+txt(uLbl(p.unidad))+' ('+p.recibo+')');return desc}
ACT.aprobarPago=d=>{const p=S.pagos.find(x=>x.id===d.id);if(!P('finAprob'))return toast('Su perfil no aprueba pagos.');if(p.regUser===SES.uid)return toast('No puede aprobar un pago que registró usted.');if(p.estado!=='por aprobar')return toast('Este pago ya fue revisado.');
  const desc=aprobarPagoInt(p);guardar();render();toast('Pago aprobado con recibo '+p.recibo+'.'+(desc?' Se aplicó el descuento por pronto pago de '+money(desc)+'.':''))};
ACT.rechazarPago=d=>modal('Rechazar el pago',`<p class="suave">Explique por qué, por ejemplo: no aparece en el extracto, la referencia no coincide o el valor es distinto.</p>${ERR}${campo('Motivo','<input id="rpgMot">')}`,`<button class="btn btn-r" data-act="rechazarPagoOk" data-id="${d.id}">Rechazar</button>`);

ACT.gestCobro=d=>{const u=unidad(d.id),k=cuentaU(d.id);const cb=u.cobro||{etapa:'Persuasivo',notas:[],acuerdo:null};modal('Gestión de cobro: '+uLbl(d.id),`<p>${esc(u.prop)}. Vencido <b style="color:var(--rojo)">${money(k.vencido)}</b>, saldo total ${money(k.saldo)}.</p>${ERR}${campo('Etapa del cobro',`<select id="gcE">${['Persuasivo','Prejurídico','Jurídico'].map(e=>`<option ${cb.etapa===e?'selected':''}>${e}</option>`).join('')}</select>`,'Persuasivo: recordatorios y llamadas. Prejurídico: carta formal con plazo. Jurídico: el abogado inicia el proceso ejecutivo.')}${campo('Nota de esta gestión','<textarea id="gcN" placeholder="Ej. Se llamó al propietario; promete pagar el 15."></textarea>')}
  <div class="sec v"><label class="chk" style="margin-bottom:10px"><input type="checkbox" id="gcAc" ${cb.acuerdo?'checked':''}> <span>Acuerdo de pago</span></label><div class="grid2">${campo('Número de cuotas',`<input type="number" id="gcCu" min="1" max="36" value="${cb.acuerdo?cb.acuerdo.cuotas:3}">`)}${campo('Primera cuota',`<input type="date" id="gcIn" value="${cb.acuerdo?cb.acuerdo.inicio:addD(hoy(),7)}">`)}</div><p class="suave peq">Cada cuota del acuerdo es el saldo vencido dividido entre el número de cuotas; la cuota del mes se sigue pagando aparte.</p></div>
  ${cb.notas.length?'<h3>Historial</h3>'+cb.notas.slice().reverse().map(n=>`<div class="lin"><span>${esc(n.texto)}</span><span class="suave peq">${fFecha(n.fecha)}</span></div>`).join(''):''}`,`<button class="btn btn-p" data-act="gestCobroOk" data-id="${d.id}">Guardar</button>`)};
ACT.gestCobroOk=d=>{const u=unidad(d.id),k=cuentaU(d.id);const cb=u.cobro||{etapa:'Persuasivo',notas:[],acuerdo:null};const e=val('gcE'),n=val('gcN');const prev=JSON.stringify(cb.acuerdo);
  if(e!==cb.etapa)cb.notas.push({fecha:hoy(),texto:'Pasa a etapa '+e.toLowerCase(),autor:quienSoy()});cb.etapa=e;if(n)cb.notas.push({fecha:hoy(),texto:n,autor:quienSoy()});

ACT.cartaCobro=d=>{const u=unidad(d.id),k=cuentaU(d.id),c=cj();const et=(u.cobro&&u.cobro.etapa)||'Persuasivo';const o=pdfBase(et==='Persuasivo'?'Recordatorio de pago':et==='Prejurídico'?'Cobro prejurídico':'Aviso de cobro jurídico');if(!o)return;
  pdfTxt(o,c.ciudad+', '+new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'}),{gap:6});pdfTxt(o,'Señor(a) '+u.prop,{b:true,gap:0});pdfTxt(o,'Propietario(a) de '+txt(uLbl(d.id)),{gap:6});
  const cuerpo={Persuasivo:`Le recordamos que su unidad tiene un saldo vencido de ${money(k.vencido)} por cuotas de administración. Le pedimos ponerse al día a la mayor brevedad. Si ya pagó, por favor reporte su pago en la app o envíe el soporte a la administración.`,Prejurídico:`A pesar de los recordatorios anteriores, su unidad mantiene un saldo vencido de ${money(k.vencido)} correspondiente a ${k.mesesV} ${k.mesesV===1?'mes':'meses'}. Le damos un plazo de diez (10) días calendario para pagar o firmar un acuerdo de pago con la administración. Vencido ese plazo, el caso pasará al abogado para iniciar el proceso ejecutivo, con los intereses, costas y honorarios que este genere, conforme a la Ley 675 de 2001.`,Jurídico:`Le informamos que, por el saldo vencido de ${money(k.vencido)}, la copropiedad entregó su caso al abogado para iniciar el cobro por vía judicial (proceso ejecutivo). Para cualquier acuerdo, comuníquese con la administración.`}[et];
  pdfTxt(o,cuerpo,{s:11.5,gap:5});pdfTxt(o,'Cómo pagar: '+(c.comoPagar||'consulte con la administración.'),{s:10.5,gap:10});pdfTxt(o,'Atentamente,',{gap:8});pdfTxt(o,'Administración '+c.nombre,{b:true});if(c.repLegal)pdfTxt(o,c.repLegal+', representante legal',{s:10});pdfFin(o.doc,'carta-cobro-'+u.torre+'-'+u.num+'.pdf')};

/* unidades y usuarios */
function formUnidad(u){u=u||{};const a=u.arr||{};return`${ERR}<div class="sec"><h3>Unidad</h3><div class="grid2">${campo('Torre, bloque o etapa',`<input id="fuT" value="${esc(u.torre||'')}" placeholder="Ej. 1, A o Casas">`)}${campo('Número',`<input id="fuN" value="${esc(u.num||'')}" placeholder="Ej. 302">`)}${campo('Coeficiente de copropiedad (%)',`<input type="number" id="fuC" step="0.0001" min="0" value="${u.coef!=null?u.coef:''}">`,'Está en el reglamento de propiedad horizontal.')}</div></div>
  <div class="sec v"><h3>Propietario</h3><div class="grid2">${campo('Nombre',`<input id="fuP" value="${esc(u.prop||'')}">`)}${campo('Celular',`<input type="tel" id="fuTel" value="${esc(u.tel||'')}">`)}${campo('Correo',`<input type="email" id="fuCo" value="${esc(u.propCorreo||'')}">`)}</div></div>
  <div class="sec a"><h3>Arrendatario (si la unidad está arrendada)</h3><div class="grid2">${campo('Nombre',`<input id="fuAN" value="${esc(a.nombre||'')}">`,'Déjelo vacío si vive el propietario o está desocupada.')}${campo('Celular',`<input type="tel" id="fuAT" value="${esc(a.tel||'')}">`)}${campo('Correo',`<input type="email" id="fuAC" value="${esc(a.correo||'')}">`)}${campo('Desde',`<input type="date" id="fuAD" value="${esc(a.desde||hoy())}">`)}</div></div>
  <div class="sec"><h3>Otros residentes y vehículos</h3>${campo('Otras personas que viven en la unidad',`<input id="fuO" value="${esc(u.otros||'')}" placeholder="Ej. Miguel Ruiz, Sofía Ruiz (menor)">`)}${campo('Placas',`<input id="fuV" value="${esc((u.vehiculos||[]).map(v=>v.placa).join(', '))}" style="text-transform:uppercase">`,'Separe las placas con comas. Portería las usa para identificar a los residentes.')}</div>`}
function leerUnidad(){const t=val('fuT'),n=val('fuN'),c=parseFloat(String(val('fuC')).replace(',','.'));if(!t||!n||!(c>=0))return null;const an=val('fuAN');
  return{torre:t,num:n,coef:c,prop:val('fuP')||'Sin registrar',tel:val('fuTel'),propCorreo:val('fuCo'),arr:an?{nombre:an,tel:val('fuAT'),correo:val('fuAC'),desde:val('fuAD')||hoy()}:null,otros:val('fuO'),vehiculos:val('fuV').toUpperCase().split(',').map(x=>x.replace(/\s/g,'')).filter(Boolean).map(p=>({placa:p,tipo:/^[A-Z]{3}\d{2}[A-Z]?$/.test(p)?'Moto':'Carro'}))}}

async function cargarJS(url,glob){if(window[glob])return window[glob];await new Promise((ok,no)=>{const s=document.createElement('script');s.src=url;s.onload=ok;s.onerror=()=>no(new Error('carga'));document.head.appendChild(s)});if(!window[glob])throw new Error('carga');return window[glob]}

V.gastos=()=>{const c=cj(),y=String(new Date().getFullYear());const gs=de('gastos').sort((a,b)=>b.fecha.localeCompare(a.fecha));const apr=gs.filter(g=>g.estado==='aprobado'&&g.fecha.startsWith(y));

ACT.solMudanza=()=>{const u=yo(),k=cuentaU(u.unidad);modal('Solicitar una mudanza',`${ERR}<div class="grid2">${campo('Tipo','<select id="smT"><option>Entrada</option><option>Salida</option></select>')}${campo('Día',`<input type="date" id="smF" value="${addD(hoy(),3)}" min="${hoy()}">`)}${campo('Franja',`<select id="smH">${FRANJAS.map((f,i)=>`<option value="${i}">${f}</option>`).join('')}</select>`)}${campo('Empresa de mudanzas','<input id="smE">')}${campo('Placa del camión','<input id="smP" style="text-transform:uppercase">')}</div>${k.saldo>0?`<div class="nota">Para una mudanza de salida, la unidad debe estar a paz y salvo. Hoy el saldo es ${money(k.saldo)}.</div>`:''}`,'<button class="btn btn-p" data-act="solMudanzaOk">Enviar solicitud</button>')};
ACT.solMudanzaOk=()=>{const u=yo();const f=val('smF');if(!f||f<hoy())return errModal('Escoja un día de hoy en adelante.');S.mudanzas.push({id:uid('md'),cj:SES.cj,unidad:u.unidad,tipo:val('smT'),fecha:f,franja:+val('smH'),empresa:val('smE'),placa:val('smP').toUpperCase().replace(/\s/g,''),solicita:u.nombre,estado:'por aprobar',creado:ahora()});aviso(SES.cj,{perfil:'admin'},'Mudanza por aprobar: '+val('smT').toLowerCase()+' de '+txt(uLbl(u.unidad))+' el '+fFecha(f)+'.','mudanzas');guardar();cerrarModal();render();toast('Solicitud enviada. Le avisamos cuando la administración la revise.')};
ACT.aprobMud=d=>{const m=S.mudanzas.find(x=>x.id===d.id);if(m.tipo==='Salida'&&cuentaU(m.unidad).saldo>0)return toast('La unidad debe estar a paz y salvo para aprobar la salida.');m.estado='aprobada';m.aprobPor=quienSoy();aviso(SES.cj,{unidad:m.unidad},'Su mudanza del '+fFecha(m.fecha)+' fue aprobada.','mudanzas');if(m.fecha===hoy())aviso(SES.cj,{perfil:'porteria'},'Mudanza aprobada para hoy: '+txt(uLbl(m.unidad))+'.','mudanzas');log('Aprobó mudanza de '+txt(uLbl(m.unidad)));guardar();render();toast('Mudanza aprobada. Le avisamos al residente.')};
ACT.rechMud=d=>modal('Rechazar la mudanza',`${ERR}${campo('Motivo (el residente lo verá)','<input id="rmM">')}`,`<button class="btn btn-r" data-act="rechMudOk" data-id="${d.id}">Rechazar</button>`);
ACT.rechMudOk=d=>{const mo=val('rmM');if(!mo)return errModal('Escriba el motivo.');const m=S.mudanzas.find(x=>x.id===d.id);m.estado='rechazada';m.motivo=mo;aviso(SES.cj,{unidad:m.unidad},'Su mudanza del '+fFecha(m.fecha)+' fue rechazada: '+mo,'mudanzas');guardar();cerrarModal();render();toast('Mudanza rechazada.')};

ACT.nuevaRestr=()=>{const res=perActual()==='residente';modal('Restringir el ingreso',`<p class="suave">${res?'Esta persona no podrá entrar a visitar su unidad. Portería recibe la alerta al registrarla.':'Esta persona no podrá entrar. Portería recibe la alerta al registrarla.'}</p>${ERR}<div class="grid2">${campo('Nombre completo','<input id="nrN">')}${campo('Documento (recomendado)','<input id="nrD">')}</div>${campo('Motivo','<input id="nrM">')}${res?'':campo('Aplica a',`<select id="nrU"><option value="">Todo el conjunto</option>${optsUnidades('',false)}</select>`)}`,'<button class="btn btn-r" data-act="nuevaRestrOk">Guardar restricción</button>')};

/* rondas */
function modalRonda(){const pts=de('puntos');const mk=RONDA.marcas;modal('Ronda en curso',`<p class="suave">Escanee el código QR de cada punto o digite el número que aparece debajo.</p><div id="camBox"></div><div class="fila" style="margin-bottom:12px"><input id="rdCod" inputmode="numeric" placeholder="Número del punto" style="max-width:200px"><button class="btn btn-p" data-act="marcarPunto">Marcar</button>${'BarcodeDetector' in window?'<button class="btn btn-s" data-act="escanear">Escanear con la cámara</button>':''}</div>${pts.map(p=>{const m=mk.find(x=>x.punto===p.id);return`<div class="lin"><span>${m?'✅':'⬜'} ${esc(p.nombre)}</span><span class="suave peq">${m?fHora(m.hora):'pendiente'}</span></div>`}).join('')}<p class="peq" style="margin-top:8px"><b>${mk.length} de ${pts.length} puntos</b></p>`,'<button class="btn btn-a" data-act="terminarRonda">Terminar ronda</button>','Pausar')}
ACT.iniRonda=()=>{if(!de('puntos').length)return toast('Primero se deben crear los puntos de control.');if(!RONDA||RONDA.cj!==SES.cj)RONDA={id:uid('rd'),cj:SES.cj,autor:quienSoy(),inicio:ahora(),marcas:[]};modalRonda()};
function marcarPunto(cod){cod=String(cod||'').replace(/^.*:/,'').trim();const p=de('puntos').find(x=>x.codigo===cod);if(!p){toast('No hay ningún punto con el número '+cod+'.');return}if(!RONDA.marcas.some(m=>m.punto===p.id))RONDA.marcas.push({punto:p.id,hora:ahora()});modalRonda();toast('Punto marcado: '+p.nombre+'.')}
ACT.marcarPunto=()=>marcarPunto(val('rdCod'));
ACT.escanear=async()=>{if(!('BarcodeDetector' in window))return toast('Este celular no permite escanear desde aquí. Digite el número que aparece debajo del código QR.');
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const box=$('#camBox');if(!box){st.getTracks().forEach(t=>t.stop());return}box.innerHTML='<video id="cam" playsinline muted style="width:100%;border-radius:12px;margin-bottom:10px"></video>';const v=$('#cam');v.srcObject=st;await v.play();const det=new BarcodeDetector({formats:['qr_code']});let fin=false;const stop=()=>{fin=true;st.getTracks().forEach(t=>t.stop());const b=$('#camBox');if(b)b.innerHTML=''};ESC_STOP=stop;
    const loop=async()=>{if(fin)return;try{const r=await det.detect(v);if(r[0]){stop();ESC_STOP=null;marcarPunto(r[0].rawValue);return}}catch(e){}requestAnimationFrame(loop)};loop()}
  catch(e){toast('No se pudo abrir la cámara. Digite el número que aparece debajo del código QR.')}};
ACT.terminarRonda=()=>{if(!RONDA)return cerrarModal();if(!RONDA.marcas.length){cerrarModal();RONDA=null;return toast('La ronda no tenía puntos marcados; no se guardó.')}RONDA.fin=ahora();S.rondas.push(RONDA);const n=RONDA.marcas.length,t=de('puntos').length;RONDA=null;guardar();cerrarModal();render();toast('Ronda guardada: '+n+' de '+t+' puntos.')};
ACT.nuevoPunto=()=>modal('Agregar punto de control',`${ERR}${campo('Nombre del punto','<input id="npN" placeholder="Ej. Terraza, Sótano 2">')}`,'<button class="btn btn-p" data-act="nuevoPuntoOk">Guardar</button>');
ACT.nuevoPuntoOk=()=>{const n=val('npN');if(!n)return errModal('Escriba el nombre del punto.');let c;do{c=String(Math.floor(1000+Math.random()*9000))}while(de('puntos').some(p=>p.codigo===c));S.puntos.push({id:uid('pt'),cj:SES.cj,nombre:n,codigo:c});guardar();cerrarModal();render();toast('Punto creado con el número '+c+'. Imprima su código QR.')};

function parseFilas(rows){const out=[];for(const r of rows){if(!r||r.length<2)continue;let fecha='',valor=null;const desc=[];for(const c of r){if(c instanceof Date&&!fecha){fecha=iso(c);continue}if(typeof c==='number'){if(valor===null)valor=c;continue}const s=String(c==null?'':c).trim();if(!s)continue;let f=null;
      if(/^\d{4}-\d{2}-\d{2}/.test(s))f=s.slice(0,10);else{const m=/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/.exec(s);if(m)f=(m[3].length===2?'20'+m[3]:m[3])+'-'+pad(m[2])+'-'+pad(m[1])}
      if(f&&!fecha){fecha=f;continue}
      if(/^-?\$?\s?[\d.,]+$/.test(s)&&valor===null){const n=parseFloat(s.replace(/[$\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));if(!isNaN(n)){valor=n;continue}}desc.push(s)}
    if(fecha&&valor>0)out.push({fecha,valor,desc:desc.join(' ')})}return out}
function conciliar(filas){const pend=de('pagos').filter(p=>p.estado==='por aprobar');const usados=new Set();return filas.map(f=>{const p=pend.find(p=>!usados.has(p.id)&&Math.abs(p.valor-f.valor)<1&&((p.ref&&f.desc.toUpperCase().includes(p.ref.toUpperCase()))||Math.abs(diasEntre(p.fecha,f.fecha))<=3));if(p)usados.add(p.id);return Object.assign({},f,{pago:p||null})})}
ACT.leerExtracto=async()=>{const f=$('#concFile')&&$('#concFile').files[0];if(!f)return toast('Escoja el archivo del extracto.');let rows=[];
  try{if(/\.(xlsx|xls)$/i.test(f.name)){const X=await cargarJS(URL_XLSX,'XLSX');const wb=X.read(await f.arrayBuffer(),{cellDates:true});rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true})}
    else{const t=await f.text();const ls=t.split(/\r?\n/).filter(Boolean);const sep=ls[0].includes(';')?';':ls[0].includes('\t')?'\t':',';rows=ls.map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,'')))}}
  catch(e){return toast('No se pudo leer el extracto. Use la plantilla.')}
  const fl=parseFilas(rows);if(!fl.length)return toast('No se encontraron movimientos con fecha y valor en el archivo.');CONC=conciliar(fl);render();toast(CONC.filter(x=>x.pago).length+' de '+CONC.length+' movimientos coinciden con pagos reportados.')};

function aplicarRemotos(r,enviados,borrados){
  let cambio=false;
  for(const x of r.registros||[]){
    const k=x.t+'|'+x.id;const arr=x.t==='usuarios'?S.usuarios:(S[x.t]=S[x.t]||[]);const i=arr.findIndex(y=>y&&y.id===x.id&&(x.t!=='usuarios'||true));

    else{const j=JSON.stringify(x.d);if(i<0||JSON.stringify(arr[i])!==j){cambio=true;if(i>=0)arr[i]=x.d;else arr.push(x.d)}SNAP.set(k,j)}
  }
  const rech=new Set((r.rechazados||[]).map(x=>x.t+'|'+x.id));
  for(const c of enviados||[]){const k=c.t+'|'+c.id;if(!rech.has(k)&&!(r.registros||[]).some(x=>x.t+'|'+x.id===k)&&c.t!=='conjunto'&&c.t!=='usuarios')SNAP.set(k,JSON.stringify(c.d))}

    try{await api('/api/inscripcion',{cj:INS_CJ,unidad:val('insU'),rol:val('insRol').split(' ')[0],nombre:val('insN'),celular:val('insTel'),correo:val('insC').toLowerCase(),clave:k1,acepto:chk('insAcepto')});const c=S.conjuntos.find(x=>x.id===INS_CJ);LAND='inicio';INS_CJ=null;limpiarReales();render();window.scrollTo(0,0);modal('Inscripción enviada',`<div class="ok-box">Recibimos su inscripción${c?' en '+esc(c.nombre):''}.</div><p>La administración la revisa. Cuando la apruebe, entre con su correo y su contraseña en «Ingresar».</p>`,'','Listo')}catch(e){errModal2(e.message)}};
  ACT.cambiarClaveOk=async()=>{const a=val('cc1'),b=val('cc2');if(a.length<10)return errModal('Mínimo 10 caracteres.');if(a!==b)return errModal('Las dos contraseñas nuevas no son iguales.');try{await api('/api/cambiar-clave',{actual:val('ccA'),nueva:a});cerrarModal();toast('Contraseña cambiada. Las demás sesiones se cerraron.')}catch(e){errModal(e.message)}};
  ACT.enlaceUsuario=async d=>{if(SES.demo)return toast('En la demostración no salen correos.');try{await sincronizar();const r=await api('/api/enlace',{uid:d.id});toast('Enlace enviado a '+r.para+'.')}catch(e){toast(e.message)}};
  const _nuevoUsuarioOk=ACT.nuevoUsuarioOk;ACT.nuevoUsuarioOk=async()=>{const antes=S.usuarios.length;_nuevoUsuarioOk();if(SES.demo||S.usuarios.length===antes)return;const u=S.usuarios[S.usuarios.length-1];cerrarModal();await sincronizar();try{const r=await api('/api/enlace',{uid:u.id});modal('Usuario creado',`<div class="ok-box">${esc(u.nombre)} quedó creado como ${PERFILES[u.perfil].n.toLowerCase()}.</div><p>Le enviamos a ${esc(r.para)} un enlace para crear su contraseña (sirve una vez y vence en 1 hora).</p>`,'','Listo')}catch(e){toast(e.message)}};
  ACT.otroConjuntoOk=async()=>{const d={nombre:val('ocN'),nit:val('ocNi'),ciudad:val('ocCi'),direccion:val('ocDi'),numUnidades:+val('ocU')};try{await sincronizar();const r=await api('/api/otro-conjunto',d);await iniciarSesion(r,'Conjunto agregado. Tiene 15 días gratis.');VISTA='pasos';render()}catch(e){errModal(e.message)}};
  const _enviarCuentas=ACT.enviarCuentas;ACT.enviarCuentas=async()=>{if(SES.demo)return _enviarCuentas();_enviarCuentas();cerrarModal();await sincronizar();try{const r=await api('/api/correo/cuentas',{});modal('Cuentas de cobro enviadas',`<div class="ok-box">Cada residente ya ve su cuenta de cobro en la app.</div><p>Además salieron ${r.enviados} correos a los propietarios que tienen correo registrado.</p>`,'','Listo')}catch(e){toast(e.message)}};
  /* ---- pagos de la suscripción con Bold ---- */
  ACT.mkPagar=()=>{const items=PEDIDO.map(id=>MODULOS.find(m=>m.id===id)).filter(Boolean).filter(m=>!m.pronto);if(!items.length)return toast('Agregue al menos un módulo.');const c=cj(),est=estadoCJ(c);const conMes=est.k!=='prueba'&&!c.interna&&!(c.pagadoHasta>=finMes(addD(hoy(),32)));PAGO_CTX={mensual:conMes,mods:items.map(m=>m.id)};modal('Revise su pedido',resumenPago(items,conMes),'<button class="btn btn-p" data-act="irAPagar">Pagar con Bold</button>')};
  ACT.pagarMensualidad=()=>{if(SES.demo)return modal('Pago de la mensualidad',resumenPago([],true)+'<div class="nota">En la demostración no se cobra nada. Cree su conjunto para usarlo de verdad.</div>','<button class="btn btn-p" data-act="quiero">Crear mi conjunto gratis</button>','Cerrar');PAGO_CTX={mensual:true,mods:[]};modal('Pagar la mensualidad',resumenPago([],true),'<button class="btn btn-p" data-act="irAPagar">Pagar con Bold</button>')};
  ACT.irAPagar=async()=>{if(!PAGO_CTX)return;try{await sincronizar();const f=await api('/api/bold/pedido',PAGO_CTX);abrirBold(f,f.valor)}catch(e){modal('No se pudo iniciar el pago',`<p>${esc(e.message)}</p>`,`<a class="btn btn-wa" href="${WA_URL}" target="_blank" rel="noopener">Escribir por WhatsApp</a>`,'Cerrar')}};
  ACT.pagoPrueba=async()=>{try{const f=await api('/api/bold/prueba',{});abrirBold(f,1000)}catch(e){toast(e.message)}};
  window.abrirBold=function(f,valor){
    modal('Pago seguro con Bold',`<p>Total: <b>${money(valor||f.amount)}</b>. Al pulsar el botón se abre la pasarela de Bold (tarjeta, PSE, Nequi o llave Bre-B). Al confirmarse el pago, se aplica solo.</p><div id="boldBox" style="min-height:60px;display:flex;justify-content:center"></div>`,'','Cerrar');
    const s=document.createElement('script');s.src='https://checkout.bold.co/library/boldPaymentButton.js';s.setAttribute('data-bold-button','dark-L');
    const at={'data-order-id':f.orderId||f.order_id||f.orden,'data-currency':f.currency||'COP','data-amount':String(f.amount||f.valor),'data-api-key':f.apiKey||f.api_key||f.llave,'data-integrity-signature':f.signature||f.integritySignature||f.firma,'data-redirection-url':f.redirectionUrl||f.redirection_url||(location.origin+'/'),'data-description':f.description||f.descripcion||'Conjunto-IA'};
    Object.entries(at).forEach(([k,v])=>{if(v)s.setAttribute(k,v)});$('#boldBox').appendChild(s)};
  /* ---- superadministrador ---- */
  renderSuperLogin=function(){return`<div class="caja"><button class="volver" data-act="land" data-l="inicio">← Volver</button><div class="panel"><h1>Acceso SkyNet Genesis</h1><p class="suave">Solo para el Superadministrador de la plataforma.</p>${ERR}${campo('Correo','<input type="email" id="saCorreo" autocomplete="username">')}${claveCampo('saClave','Contraseña')}<button class="btn btn-a" style="width:100%" data-act="superLogin">Entrar</button><button class="link" style="margin-top:10px" data-act="superOlvido">Primera vez u olvidó su contraseña</button></div></div>`};
  ACT.superLogin=async()=>{try{const r=await api('/api/sa/login',{correo:val('saCorreo').toLowerCase(),clave:val('saClave')});TOKEN=r.token;TOKEN_SUPER=r.token;guardarToken();SES={super:true,cj:null};SUPTAB='conjuntos';BUSCA='';await cargarResumenSA();render();window.scrollTo(0,0)}catch(e){errModal2(e.message)}};
  ACT.superOlvido=async()=>{try{const r=await api('/api/sa/olvido',{});modal('Revise su correo',`<p>${esc(r.mensaje||'Le enviamos el enlace.')}</p>`,'','Listo')}catch(e){toast(e.message)}};
  ACT.superTab=async d=>{SUPTAB=d.t;BUSCA='';if(TOKEN_SUPER){TOKEN=TOKEN_SUPER;try{await cargarResumenSA()}catch(e){}}render()};
  ACT.superEntrar=async d=>{try{TOKEN=TOKEN_SUPER;const r=await api('/api/sa/entrar',{cj:d.id});TOKEN=r.token;guardarToken();SES={super:true,cj:d.id,perfil:'admin',uid:'super'};cargarEstado(r.estado);VISTA='inicio';render();window.scrollTo(0,0)}catch(e){toast(e.message)}};
  ACT.superVolver=async()=>{await sincronizar();TOKEN=TOKEN_SUPER;guardarToken();SES={super:true,cj:null};try{await cargarResumenSA()}catch(e){}render()};
  ACT.superInternaOk=async d=>{const m=val('motInt');if(!m)return errModal('Escriba el motivo.');try{TOKEN=TOKEN_SUPER;await api('/api/sa/interna',{id:d.id,motivo:m});await cargarResumenSA();cerrarModal();render();toast('Listo.')}catch(e){errModal(e.message)}};
  ACT.superBold=d=>modal('Aplicar un pago de Bold no aplicado',`<p class="suave">Escriba la referencia del pago (o del pedido) en Bold. El sistema lo confirma con Bold y solo aplica lo que Bold aprobó.</p>${ERR}${campo('Referencia de Bold','<input id="sbRef" placeholder="Ej. TLBHU0QJA7S o SGCONJUN-…">')}${campo('Motivo (obligatorio)','<input id="sbMot">')}`,`<button class="btn btn-a" data-act="superBoldOk" data-id="${d.id}">Comprobar y aplicar</button>`);
  ACT.superBoldOk=async d=>{try{TOKEN=TOKEN_SUPER;const r=await api('/api/sa/aplicar',{id:d.id,ref:val('sbRef'),motivo:val('sbMot')});await cargarResumenSA();cerrarModal();render();toast('Resultado: '+r.estado+'.')}catch(e){errModal(e.message)}};
  ACT.superEnlace=async d=>{try{TOKEN=TOKEN_SUPER;const r=await api('/api/sa/enlace',{uid:d.id});toast('Enlace enviado a '+r.para+'.')}catch(e){toast(e.message)}};
  ACT.superBloq=d=>{const u=S.usuarios.find(x=>x.id===d.id);if(u.bloqueado){TOKEN=TOKEN_SUPER;return api('/api/sa/bloquear',{uid:u.id,bloquear:false}).then(cargarResumenSA).then(()=>{render();toast('Cuenta desbloqueada.')}).catch(e=>toast(e.message))}modal('Bloquear la cuenta',`<p>${esc(u.nombre)}, ${esc(u.correo)}</p>${ERR}${campo('Motivo (obligatorio)','<input id="sbqMot">')}`,`<button class="btn btn-r" data-act="superBloqOk" data-id="${u.id}">Bloquear</button>`)};
  ACT.superBloqOk=async d=>{try{TOKEN=TOKEN_SUPER;await api('/api/sa/bloquear',{uid:d.id,bloquear:true,motivo:val('sbqMot')});await cargarResumenSA();cerrarModal();render();toast('Cuenta bloqueada.')}catch(e){errModal(e.message)}};
  ACT.respaldo=async()=>{try{TOKEN=TOKEN_SUPER;const r=await api('/api/sa/respaldo');descargar('respaldo-conjunto-ia-'+hoy()+'.json',JSON.stringify(r,null,1))}catch(e){toast(e.message)}};
  /* ---- arranque con sesión guardada y regreso de Bold ---- */
  window.arrancarServidor=async function(){
    const qs=new URLSearchParams(location.search);const ref=qs.get('bold-order-id');
    if(TOKEN&&SES&&!SES.demo){
      try{if(SES.super&&!SES.cj){await cargarResumenSA()}else{const e=await api('/api/estado');cargarEstado(e)}}catch(e){if(!e.red){TOKEN=null;guardarToken();SES=null}}
    }else if(SES&&!SES.demo){SES=null}
    if(ref){history.replaceState(null,'',location.pathname+location.hash);try{const r=await api('/api/bold/volver?ref='+encodeURIComponent(ref));if(SES&&!SES.demo&&SES.cj){const e=await api('/api/estado');cargarEstado(e)}render();modal(r.estado==='aplicado'?'Pago recibido':'Estamos confirmando su pago',r.estado==='aplicado'?'<div class="ok-box">Bold confirmó el pago y ya quedó aplicado. ¡Gracias!</div>':r.estado==='revisar'?'<p>Recibimos el pago, pero necesita una revisión. Le escribimos pronto.</p>':'<p>Bold aún no confirma el pago. En unos minutos se aplica solo; no tiene que volver a pagar.</p>','','Listo');return}catch(e){}}
    render();
    if(LAND==='inscripcion'&&INS_COD&&!INS_CJ){const i=$('#insCod');if(i){i.value=INS_COD;ACT.insBuscar()}}
  };
}
window.addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash||'').replace(/^#/,'');if(h.startsWith('clave-')){CLAVE_TOKEN=h.slice(6);cerrarModal();SES=null;LAND='clave';render()}else if(h.startsWith('inscribirme')){const cod=h.replace(/^inscribirme-?/,'').toUpperCase();INS_COD=cod;SES=null;LAND='inscripcion';cerrarModal();render();if(SERVIDOR&&cod)setTimeout(()=>{const i=$('#insCod');if(i){i.value=cod;ACT.insBuscar()}},50)}});
function arrancar(){if(SERVIDOR)return arrancarServidor();render()}
/* =========================================================
   ARRANQUE Y EVENTOS
   ========================================================= */
function render(){
  const app=document.getElementById('app');
  if(SES&&SES.super&&!SES.cj){app.innerHTML=renderSuper();return}
  if(SES&&SES.cj&&!cj()){SES=null}
  if(SES&&!SES.super&&!S.usuarios.find(u=>u.id===SES.uid)){SES=null}
  if(!SES){app.innerHTML=renderLanding();return}
  const c=cj();if(estadoCJ(c).k==='cerrada'&&!SES.super&&!c.demo){app.innerHTML=renderCerrado(c);return}
  app.innerHTML=renderShell();postRender();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(!ACT[a])return;
  if(b.classList.contains('velo')){cerrarMenu();return}
  if(b.tagName==='INPUT'){try{ACT[a](b.dataset,b)}catch(err){console.error(err)}return}
  if(b.tagName==='A'&&b.getAttribute('target'))return;
  e.preventDefault();try{const r=ACT[a](b.dataset,b);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Ocurrió un error. Intente de nuevo.')})}catch(err){console.error(err);toast('Ocurrió un error. Intente de nuevo.')}});
document.addEventListener('input',e=>{if(e.target.id==='rgUnid'){const s=document.getElementById('rgPlan');if(s)s.textContent=planTxt(e.target.value)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;if(id==='codIn'){e.preventDefault();ACT.buscarCodigo()}else if(id==='lgClave'||id==='lgCorreo'){e.preventDefault();ACT.login()}else if(id==='placaBus'){e.preventDefault();ACT.buscarPlaca()}else if(id==='saClave'||id==='saClave2'){e.preventDefault();ACT.superLogin()}else if(id==='supBus'){e.preventDefault();ACT.supBuscar()}});
(function(){const h=decodeURIComponent(location.hash||'').replace(/^#/,'');if(!h)return;
  if(h.startsWith('registro')){const m=/mods[=-]([^&]+)/.exec(h);if(m){PEDIDO=m[1].split(/[,_]/).filter(x=>MODULOS.some(y=>y.id===x))}SES=null;LAND='registro'}
  else if(h.startsWith('inscribirme')){const cod=h.replace(/^inscribirme-?/,'').toUpperCase();SES=null;LAND='inscripcion';INS_COD=cod;const c=S.conjuntos.find(x=>(x.codigo||'')===cod);INS_CJ=c?c.id:null}
  else if(h.startsWith('demo')){SES=null;LAND='inicio';setTimeout(()=>{const e=document.getElementById('demo');if(e)e.scrollIntoView()},300)}
  else if(h.startsWith('ingresar')){SES=null;LAND='login'}
  else if(h.startsWith('clave-')){CLAVE_TOKEN=h.slice(6);SES=null;LAND='clave'}})();
window.addEventListener('online',()=>{estadoRed();toast('Volvió la conexión. Todo quedó guardado.')});window.addEventListener('offline',estadoRed);
arrancar();
</script>
